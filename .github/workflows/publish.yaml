# Publishes Apache Druid as a multi-arch image (linux/amd64, linux/arm64) to
# ghcr.io/bsure-analytics/druid, because apache/druid is published for linux/amd64 only.
#
# The image is built by the upstream Dockerfile at the release tag, unchanged, but fed with
# the signed binary release instead of a Maven build (BUILD_FROM_SOURCE=false). The release
# is pure Java, so the same tarball serves both architectures, with the same extensions and
# release versions as apache/druid.
#
# Every night, and on every push to main, the apache/druid GitHub releases since
# OLDEST_VERSION are compared with the published tags, and each missing one is built and
# pushed - backports to older release lines included. Published tags are never overwritten.
# Pull requests build and test the latest release without pushing. A manual run builds the
# given version.
---
concurrency:
  # A push to main must not cancel a nightly run, which shares its ref:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/druid
  # Releases before this one are never built:
  OLDEST_VERSION: 38.0.0
jobs:
  versions:
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    permissions:
      actions: write # re-enable this workflow, see below
    runs-on: ubuntu-latest
    steps:
      - id: versions
        name: Find the versions to build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            versions="$INPUT_VERSION"
          else
            releases="$(gh api 'repos/apache/druid/releases?per_page=30' --jq '
              .[] | select((.draft or .prerelease) | not) | .tag_name
                  | select(startswith("druid-")) | ltrimstr("druid-")
            ' | sort --version-sort --reverse)"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              releases="$(echo "$releases" | head -n 1)"
            fi
            versions=""
            for version in $releases; do
              oldest="$(printf '%s\n%s\n' "$OLDEST_VERSION" "$version" | sort --version-sort | head -n 1)"
              [ "$oldest" = "$OLDEST_VERSION" ] || continue
              if [ "$GITHUB_EVENT_NAME" = pull_request ] ||
                ! docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
                versions="$versions $version"
              fi
            done
          fi
          echo "Versions to build:${versions:- none}"
          echo "versions=$(jq --arg versions "$versions" --compact-output --null-input \
            '$versions | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'schedule'
        name: Keep the schedule alive
        # GitHub disables scheduled workflows in public repositories after 60 days without
        # repository activity. Re-enabling the workflow resets that timer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yaml/enable"
  publish:
    env:
      DRUID_VERSION: ${{ matrix.version }}
    if: needs.versions.outputs.versions != '[]'
    needs: versions
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    # ubuntu-latest rather than the org's self-hosted runners: this repository is public,
    # and runner groups do not serve public repositories by default.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: druid
          ref: druid-${{ env.DRUID_VERSION }}
          repository: apache/druid
      - name: Download and verify the binary release
        # downloads.apache.org keeps the current releases only, archive.apache.org all of them.
        run: |
          fetch() {
            for base in https://downloads.apache.org/druid https://archive.apache.org/dist/druid; do
              curl --fail --location --silent --show-error --remote-name "$base/$1" && return
            done
            return 1
          }
          tarball="apache-druid-$DRUID_VERSION-bin.tar.gz"
          mkdir -p druid/distribution/target
          cd druid/distribution/target
          fetch KEYS
          fetch "$DRUID_VERSION/$tarball"
          fetch "$DRUID_VERSION/$tarball.asc"
          fetch "$DRUID_VERSION/$tarball.sha512"
          echo "$(cat "$tarball.sha512")  $tarball" | sha512sum --check
          gpg --batch --import KEYS
          gpg --batch --verify "$tarball.asc" "$tarball"
          rm KEYS "$tarball.asc" "$tarball.sha512"
      - id: published
        name: Check whether the tag is published already
        run: |
          if docker buildx imagetools inspect "$IMAGE:$DRUID_VERSION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$DRUID_VERSION exists already and will not be pushed again"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The final stage runs a few RUN steps, which need emulation for linux/arm64. The
      # builder stage is pinned to linux/amd64 upstream and runs natively here.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and test each platform
        # Builds into the builder's cache, so the push below rebuilds nothing.
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build druid \
              --build-arg BUILD_FROM_SOURCE=false \
              --file druid/distribution/docker/Dockerfile \
              --load \
              --platform "$platform" \
              --tag "druid:test"
            docker run --rm --entrypoint /bin/sh --platform "$platform" druid:test -c '
              ls extensions/druid-kubernetes-overlord-extensions extensions/postgresql-metadata-storage > /dev/null &&
              bin/run-java -cp "lib/*" org.apache.druid.cli.Main version
            ' | tee version.txt
            grep --fixed-strings --quiet "$DRUID_VERSION" version.txt
          done
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=Unofficial multi-arch build of Apache Druid ${{ env.DRUID_VERSION }} from the signed binary release
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=Apache Druid
            org.opencontainers.image.version=${{ env.DRUID_VERSION }}
          tags: type=raw,value=${{ env.DRUID_VERSION }}
      - if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: BUILD_FROM_SOURCE=false
          context: druid
          file: druid/distribution/docker/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
name: Publish
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Druid version to build, e.g. 38.0.0 - the missing releases if empty
        required: false
        type: string
permissions:
  contents: read
